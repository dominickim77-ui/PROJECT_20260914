<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>


    <script>
        v3="123"
        console.log(v3 + 5)
        console.log(v3 + "5")
        console.log(v3 * 5)
        v4 = 123
        console.log(v4 + 5)
        console.log(v4 + "5")
        console.log(v4 * 5)



        // 문자열 함수들
        str_length = "abc,def"
        console.log(str_length.length);
        console.log(str_length.split(","));
        // str_length.substring(2,4) 결과물 ""
        console.log(str_length.substring(2, 4));
        console.log(str_length.split("," , 1))
        console.log(str_length.substring(2));

        // 숫자 math 함수(메소드)들
        console.log( Math.max(2,6,3,9,4) )
        console.log( Math.min(2,6,3,9,4) )
        console.log( Math.abs(-0.34) )
        console.log( Math.random())
        console.log( Math.round(3.7))
        console.log( Math.floor(3.7))
        console.log( Math.ceil(3.7))


    </script>
</body>
</html>
