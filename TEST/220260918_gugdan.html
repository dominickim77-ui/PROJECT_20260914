<!DOCTYPE html>

<body>
    <script>
        // 구구단 (선생님 방법)
        for ( dan = 2 ; dan < 10; dan++) {
            console.log(dan + "단")
            for (i=1; i<10; i++){
                console.log( dan + "*" + i + "=" + dan*i)
            }
            console.log("===")
        }
        console.log("구구단 띁")
    </script>

    
  
</body>
